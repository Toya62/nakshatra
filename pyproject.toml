[project]
name = "nakshatra"
version = "0.1.0"
description = "Vedic Astrology AI Engine - Swiss Ephemeris birth charts, Vimshottari dashas, Shodashavarga, Ashtakavarga, and Shadbala"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    {name = "Toya", email = "toya@example.com"}
]
dependencies = [
    "mayaastrolib>=0.1.0",
    "pyswisseph>=2.10.3",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
nakshatra = "nakshatra.__main__:main"
nakshatra-api = "nakshatra.api:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]