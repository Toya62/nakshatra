[project]
name = "nakshatra"
version = "0.1.0"
description = "Vedic Astrology AI Engine - Swiss Ephemeris birth charts, Vimshottari dashas, Shodashavarga, Ashtakavarga, Shadbala, and Gochar transits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Toya", email = "pandey.ramu62@gmail.com"}
]
dependencies = [
    "mayaastrolib>=0.1.0",
    "pyswisseph>=2.10.3",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=0.27.0",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
ai = [
    "sentence-transformers>=2.2.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
]
streamlit = [
    "streamlit>=1.31.0",
]

[project.scripts]
nakshatra = "nakshatra.__main__:main"
nakshatra-api = "nakshatra.api:app"
nakshatra-mcp = "nakshatra.mcp_server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nakshatra*"]
exclude = ["web*", "frontend*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "swisseph"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]