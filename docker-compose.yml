services:
  caddy:
    image: caddy:2-alpine
    container_name: nakshatra-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakshatra-backend
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - HOST=0.0.0.0
    env_file:
      - path: .env
        required: false

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nakshatra-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8004
      - PORT=3000
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
