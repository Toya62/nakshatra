services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakshatra-backend
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - HOST=0.0.0.0
    env_file:
      - path: .env
        required: false

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nakshatra-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - BACKEND_URL=http://backend:8004
      - PORT=3000
    depends_on:
      - backend
